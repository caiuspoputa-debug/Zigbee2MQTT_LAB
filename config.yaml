name: Zigbee2MQTT M1S ZoH LAB Experimental
version: 2.14.1-lab.19
slug: zigbee2mqtt_m1s_zoh_lab
description: Experimental ZoH indirect-transmission fix with Aqara join diagnostics
url: https://github.com/Koenkk/zigbee2mqtt
startup: application
boot: auto
init: false
arch:
  - amd64
  - aarch64
  - armv7
map:
  - addon_config:rw
ports:
  8080/tcp: 8099
ports_description:
  8080/tcp: Zigbee2MQTT LAB frontend
webui: http://[HOST]:[PORT:8080]
options:
  m1s_host: 192.168.0.107
  m1s_port: 1886
  mqtt_server: mqtt://core-mosquitto:1883
  mqtt_user: ""
  mqtt_password: ""
  channel: 20
  permit_join: false
schema:
  m1s_host: str
  m1s_port: port
  mqtt_server: str
  mqtt_user: str?
  mqtt_password: password?
  channel: int(11,26)
  permit_join: bool
